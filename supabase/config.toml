project_id = "tiacepizzas"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "https://tiacepizzas.com.br"
additional_redirect_urls = ["https://tiacepizzas.com.br/**", "http://localhost:5173/**"]
# A equipe entra com e-mail e senha; o cliente cria a conta dele no site (e-mail e senha, Google ou Facebook).
# Quem se cadastra pelo site é sempre cliente: o acesso ao painel depende do papel em app_metadata, que só o
# servidor grava (migração conta_email_pagamentos). Depois de mudar algo aqui: npx supabase config push
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# A conta do cliente já nasce confirmada: o envio de e-mails que vem com o Supabase é limitado a poucos por hora
# e travaria o cadastro. Para confirmar por e-mail, configure antes um SMTP próprio no painel do Supabase.
enable_confirmations = false

# Entrada social dos clientes (Google e Facebook): ligue em Authentication > Providers no painel do Supabase,
# com as credenciais criadas no Google Cloud e na Meta. O passo a passo está no README.

# As duas funções conferem a sessão por conta própria (auth.getUser + perfil ativo + permissão),
# então a checagem de JWT do gateway fica desligada: ela não é confiável com as chaves de assinatura novas (ES256).
[functions.fiscal]
verify_jwt = false

[functions.admin-usuarios]
verify_jwt = false
